<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="52%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Squircle background -->
  <rect width="100" height="100" rx="26" ry="26" fill="url(#g1)"/>
  <!-- Grid pattern overlay -->
  <rect width="100" height="100" rx="26" ry="26" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/>
  <!-- Network nodes and connections -->
  <g filter="url(#glow)" opacity="0.55">
    <line x1="20" y1="30" x2="50" y2="50" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="80" y1="30" x2="50" y2="50" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="20" y1="70" x2="50" y2="50" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="80" y1="70" x2="50" y2="50" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="20" cy="30" r="4" fill="rgba(255,255,255,0.5)"/>
    <circle cx="80" cy="30" r="4" fill="rgba(255,255,255,0.5)"/>
    <circle cx="20" cy="70" r="4" fill="rgba(255,255,255,0.5)"/>
    <circle cx="80" cy="70" r="4" fill="rgba(255,255,255,0.5)"/>
  </g>
  <!-- Center "C" letterform -->
  <text x="50" y="67" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="46" font-weight="900" fill="white" letter-spacing="-2">C</text>
  <!-- Center node -->
  <circle cx="50" cy="50" r="5" fill="white" opacity="0.85" filter="url(#glow)"/>
</svg>
