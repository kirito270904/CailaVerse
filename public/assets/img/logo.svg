<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="52%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Squircle background -->
  <rect width="100" height="100" rx="26" ry="26" fill="url(#g1)"/>
  <!-- Grid pattern overlay -->
  <rect width="100" height="100" rx="26" ry="26" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="0.5"/>
  <!-- Network nodes and spherical orbital connections -->
  <g filter="url(#glow)" opacity="0.65">
    <ellipse cx="50" cy="50" rx="34" ry="14" stroke="white" stroke-width="1.6" stroke-dasharray="3 3" transform="rotate(-25 50 50)"/>
    <ellipse cx="50" cy="50" rx="34" ry="14" stroke="white" stroke-width="1.6" stroke-dasharray="3 3" transform="rotate(35 50 50)"/>
    <circle cx="22" cy="38" r="3.5" fill="white"/>
    <circle cx="78" cy="62" r="3.5" fill="white"/>
    <circle cx="28" cy="68" r="3.5" fill="white"/>
    <circle cx="72" cy="32" r="3.5" fill="white"/>
  </g>
  <!-- Center "O" OmniSphere letterform -->
  <circle cx="50" cy="50" r="18" stroke="white" stroke-width="6.5" fill="none"/>
  <!-- Center pulse core -->
  <circle cx="50" cy="50" r="6" fill="#00d2ff" filter="url(#glow)"/>
</svg>
